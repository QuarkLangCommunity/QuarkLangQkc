name: release

# Pushing a v* tag releases: native builds on three platforms (cgo on -> FFI works) + version injection + changelog + checksum manifest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.0.0; empty uses the VERSION file)'
        required: false

# Least privilege: workflow-level read-only; **only the release job** additionally gets contents: write (create the Release, upload assets).
# The build jobs (three platforms) do not write to the repository, so they need no write permission.
permissions:
  contents: read

# Releases are neither concurrent nor cancelled: two simultaneous tags queue up instead of interrupting a release in flight
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned; dependabot updates weekly)
        with:
          fetch-depth: 0   # the changelog needs the full history and tags

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 (SHA-pinned; dependabot updates weekly)
        with:
          go-version: '1.26'

      - name: Version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(cat VERSION)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version: $v"

      - name: Tests (interpreter + compiler)
        shell: bash
        run: |
          go test ./... -count=1
          (cd compiler && go test ./... -count=1)

      - name: Build every tool (host platform, cgo on -> FFI available)
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          ext=""; [ "${RUNNER_OS}" = "Windows" ] && ext=".exe"
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)    plat="linux-amd64" ;;
            Linux-ARM64)  plat="linux-arm64" ;;
            macOS-X64)    plat="darwin-amd64" ;;
            macOS-ARM64)  plat="darwin-arm64" ;;
            Windows-X64)  plat="windows-amd64" ;;
            Windows-ARM64) plat="windows-arm64" ;;
            *) plat="unknown" ;;
          esac
          mkdir -p out
          for spec in "quark:." "qkcheck:./cmd/qkcheck" "qkdoc:./cmd/qkdoc" "qkrepl:./cmd/qkrepl" "qklsp:./cmd/qklsp"; do
            name="${spec%%:*}"; pkg="${spec##*:}"
            go build -trimpath -ldflags "-s -w -X main.version=$V" -o "out/${name}-${V}-${plat}${ext}" "$pkg"
          done
          (cd compiler && go build -trimpath -ldflags "-s -w -X main.version=$V" -o "../out/qkc-${V}-${plat}${ext}" .)
          # Version-less aliases: they keep the one-line command in the README stable (releases/latest/download/<tool>-<platform>)
          for f in out/*-${V}-${plat}${ext}; do
            alias="$(echo "$(basename "$f")" | sed "s/-${V}-/-/")"
            cp "$f" "out/$alias"
          done
          echo "build complete:"; ls -la out

      - name: Verify manifest (sha256)
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          { echo "# QuarkLang ${V} release artifacts (${RUNNER_OS}/${RUNNER_ARCH}, cgo enabled)"; } > "out/MANIFEST-${V}-${RUNNER_OS}.txt"
          for f in out/*; do
            case "$f" in *MANIFEST*) continue;; esac
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> "out/MANIFEST-${V}-${RUNNER_OS}.txt"
          done
          cat "out/MANIFEST-${V}-${RUNNER_OS}.txt"

      - name: Smoke test (run an example + --version)
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          ext=""; [ "${RUNNER_OS}" = "Windows" ] && ext=".exe"
          bin="$(ls out/quark-*-$V-*${ext} 2>/dev/null | head -1 || true)"
          [ -z "$bin" ] && bin="$(ls out/quark-*${ext} | head -1)"
          chmod +x "$bin" || true
          "./$bin" --version
          "./$bin" examples/hello.qk
          chmod +x out/qkcheck-*${ext} || true
          "$(ls out/qkcheck-*${ext} | head -1)" examples/ || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA-pinned; dependabot updates weekly)
        with:
          name: quarklang-${{ steps.ver.outputs.version }}-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish (GitHub Release + changelog)
    needs: build
    runs-on: ubuntu-latest
    # Human gate: the required reviewer of the "release" environment must approve before publishing (admin bypass is off)
    environment: release
    # The only job that needs write access: create the Release and upload assets (every other job has contents: read)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned; dependabot updates weekly)
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(cat VERSION)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (SHA-pinned; dependabot updates weekly)
        with:
          path: artifacts

      - name: Generate changelog
        run: |
          chmod +x scripts/changelog.sh
          ./scripts/changelog.sh "${{ steps.ver.outputs.version }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Summarize artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release | head -50

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          gh release create "$tag" \
            --title "QuarkLang ${tag}" \
            --notes-file RELEASE_NOTES.md \
            --target "${GITHUB_SHA}" \
            release/* 2>/dev/null || \
          gh release upload "${tag}" release/* --clobber
