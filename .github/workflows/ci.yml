name: ci
on: [push, pull_request]

# Least privilege: CI only reads the repository (every job here just checks out, builds, tests and runs benchmarks).
# Declared explicitly instead of relying on repository defaults: auditable, and defaults cannot be widened silently.
permissions:
  contents: read

# A new push on the same ref cancels older runs (saves runners; the release flow has its own concurrency, see release.yml)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-platform gate: the same Go tests run on Linux / macOS / Windows (including the multi-round P99 false-positive/false-negative statistics)
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Build & test (interpreter + toolchain + editor artifacts)
        run: |
          go build ./...
          go test ./... -count=1
      - name: Build & test (compiler qkc)
        working-directory: compiler
        run: |
          go build ./...
          go test ./... -count=1
      - name: qkcheck false-positive/false-negative statistics (multi-round P99 gate)
        env:
          LINT_ROUNDS: '2000'
        run: go test ./internal/lang/ -run 'TestLintStatsP99' -count=1 -v
      - name: Corpus perturbation invariance (CRLF / comments / line shifts)
        run: go test ./internal/lang/ -run 'TestLintCorpusPerturbation|TestLintCRLF' -count=1 -v

  # Stress / robustness suite: the extreme-input corpus executed against BOTH engines under a hard wall
  # clock and memory bound, on all three platforms. One bounded job per platform instead of a Linux-only
  # gate, because the three defects the suite found were platform-independent by construction (a Go stack
  # overflow, a missing call-depth counter) and the fix must not reintroduce a platform-dependent answer.
  #
  # The subset: the two cases whose cost is dominated by sheer size rather than by the property this job
  # guards are skipped with -skip — path_fn_10k_params (9.2 s of a 10 s default bound and 1.6 GiB peak RSS
  # on the machine that measured the report, so it flakes on a shared runner) and res_few_mb (a 4 MB
  # program, 6.3 s of compile and link). Everything else runs, with -timeout 90s explicit so no case can
  # fail on the bound alone. The full corpus stays the developer-facing gate (see stress/README.md).
  #
  # RSS: the runner samples the process group through /proc on Linux only and records -1 ("unavailable")
  # elsewhere, which the report renders as "-". The bound therefore degrades instead of failing on macOS
  # and Windows, where the job still checks exit statuses, output parity and the wall-clock bound.
  stress:
    name: stress suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Ensure clang is available (added to PATH on Windows)
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          fi
          clang --version | head -2
      - name: Build both engines into the generated tree
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=.exe; else EXT=; fi
          go build -o "stress-out/bin/quark$EXT" .
          (cd compiler && go build -o "../stress-out/bin/qkc$EXT" .)
          echo "STRESS_EXT=$EXT" >> "$GITHUB_ENV"
      - name: Materialise the extreme corpus (gitignored, ~10 MB)
        run: go run ./cmd/qkstress gen -out stress-out/cases
      - name: Run the bounded subset against both engines
        run: |
          go run ./cmd/qkstress run \
            -cases stress-out/cases \
            -interp "stress-out/bin/quark$STRESS_EXT" \
            -compiler "stress-out/bin/qkc$STRESS_EXT" \
            -work stress-out \
            -timeout 90s \
            -skip 'path_fn_10k_params|res_few_mb' \
            -known stress/known-failures.txt
      - name: Upload the measured report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-report-${{ matrix.os }}
          path: |
            stress-out/report.md
            stress-out/results.json

  # Linux extras: the parts that need clang/bash/tree-sitter/node stay on Linux
  linux-extras:
    name: linux extras (dual-path / editors / release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Dual-path comparison (interpreter vs qkc)
        run: |
          go build -o /tmp/quark main.go
          cd compiler && ./testdata/compare.sh
      - name: Build toolchain binaries (qkcheck/qkdoc/qkrepl/qklsp)
        run: |
          for t in qkcheck qkdoc qkrepl qklsp; do go build -o "/tmp/$t" "./cmd/$t"; done
          /tmp/qkcheck --version && /tmp/qkdoc --version && /tmp/qkrepl --version && /tmp/qklsp --version
      - name: Linter self-check (qkcheck over this repo corpus; -exit0 = report mode, the gate lives in the Go snapshot test)
        run: /tmp/qkcheck -exit0 examples compiler/testdata
      - name: "Editors: tree-sitter grammar (optional; runs when the CLI is installed)"
        run: |
          if command -v tree-sitter >/dev/null 2>&1; then
            cd editors/tree-sitter-quarklang
            tree-sitter generate
            tree-sitter test -p .
          else
            echo "tree-sitter CLI not installed, skipping"
          fi
      - name: "Editors: VS Code extension LSP client integration"
        run: QKLSP=/tmp/qklsp node editors/vscode/test/protocol.test.js
      - name: WebAssembly engine build (GOOS=js GOARCH=wasm; the web playground links this artifact)
        run: |
          GOOS=js GOARCH=wasm go build -o "$RUNNER_TEMP/quark.wasm" ./cmd/quarkwasm
          ls -la "$RUNNER_TEMP/quark.wasm"
      - name: Coverage report (root + compiler modules; written to the job summary and uploaded)
        run: |
          ./scripts/coverage.sh -o "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Interpreter vs native benchmark report (1 round; parity between the two backends is asserted)
        run: |
          ./scripts/bench-report.sh 1 > "$RUNNER_TEMP/bench-report.md"
          cat "$RUNNER_TEMP/bench-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Library benchmark smoke (build + run once, guards against rot)
        run: go test ./internal/lang/ ./cmd/qkcheck ./cmd/qkdoc ./cmd/qklsp -run XXX -bench . -benchtime 1x -count=1
      - name: Toolchain benchmark smoke
        run: ./scripts/bench-tools.sh 3
      - name: Release artifact smoke (this platform only; verifies the script; absolute output paths to cover path normalization)
        run: |
          out="${RUNNER_TEMP:-/tmp}/quarklang-dist-ci"
          rm -rf "$out"
          QUARK_TARGETS="linux/amd64" ./scripts/build-release.sh 0.0.0-ci "$out"
          for t in quark qkc qkcheck qkdoc qkrepl qklsp; do
            ls "$out/$t"-0.0.0-ci-linux-amd64 >/dev/null || { echo "missing artifact: $t"; exit 1; }
          done
          ls -la "$out"
      - name: Changelog generation smoke
        run: ./scripts/changelog.sh 0.0.0-ci | head -20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarklang-ci-linux-amd64
          path: ${{ runner.temp }}/quarklang-dist-ci/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarklang-reports
          path: |
            ${{ runner.temp }}/coverage.md
            ${{ runner.temp }}/bench-report.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quark-wasm
          path: ${{ runner.temp }}/quark.wasm

  # Library artifacts / preprocessor: run for real on all three platforms (emit -> link -> run) to prove nothing depends on a .so
  libraries:
    name: libraries & preprocessor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Ensure clang is available (added to PATH on Windows)
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          fi
          clang --version | head -2
      - name: Build qkc
        working-directory: compiler
        run: |
          go build -o qkc .
          if [ -f qkc.exe ]; then echo "QKC=$PWD/qkc.exe" >> "$GITHUB_ENV"; else echo "QKC=$PWD/qkc" >> "$GITHUB_ENV"; fi
      - name: Emit library (multi-platform variants + obfuscation)
        run: |
          mkdir -p /tmp/qklib-ci && cd /tmp/qklib-ci
          cat > ext.qk <<'QK'
          fn scale_cap(int base) int {
          #if os("windows")
              return base + 40;
          #elif os("darwin")
              return base + 38;
          #else
              return base + 37;
          #endif
          }
          fn weight_of(int k, int a) int { return k * 100 + a * 25; }
          QK
          "$QKC" --emit-lib --obfuscate --lib-name libtest --lib-version 0.1.0 \
                 --lib-targets linux-x86_64,windows-x86_64,darwin-arm64,darwin-x86_64 \
                 -o ci.qklib ext.qk
          test -s ci.qklib
      - name: Link the library and run (asserts the platform branch)
        run: |
          cd /tmp/qklib-ci
          cat > app.qk <<'QK'
          fn main(IOStream io) {
              io.println(libtest.scale_cap(21));
              io.println(libtest.weight_of(3, 2));
          }
          QK
          "$QKC" -c -L ci.qklib -o app app.qk
          OUT=$(./app 2>/dev/null || ./app.exe)
          echo "output: $OUT"
          # Platform branch values: linux 21+37=58 / macOS 21+38=59 / windows 21+40=61
          case "$RUNNER_OS" in
            Linux)   WANT=58 ;;
            macOS)   WANT=59 ;;
            Windows) WANT=61 ;;
          esac
          FIRST=$(echo "$OUT" | head -1)
          [ "$FIRST" = "$WANT" ] || { echo "platform branch assertion failed: expected $WANT, got $FIRST"; exit 1; }
          echo "$OUT" | sed -n 2p | grep -q '^350$' || { echo "weight function assertion failed (expected 350)"; exit 1; }
          # The artifact must not depend on a shared library
          if command -v readelf >/dev/null 2>&1; then
            ! readelf -d app 2>/dev/null | grep -qi 'NEEDED.*libtest' || { echo "must not depend on a shared library"; exit 1; }
          fi
      - name: Cross-target preprocessing (--target-os selects the variant)
        run: |
          cd /tmp/qklib-ci
          "$QKC" --emit-ir --target-os windows -L ci.qklib app.qk > win.ll
          "$QKC" --emit-ir --target-os darwin -L ci.qklib app.qk > mac.ll
          # In the IR the constant is add's second operand (like `%2 = add i32 %1, 40`); do not match it as a literal
          if ! grep -qE 'add i32 %[0-9]+, 40$' win.ll; then
            echo "the windows variant did not take effect"; sed -n '/merged library IR/,/^}/p' win.ll | head -20; exit 1
          fi
          if ! grep -qE 'add i32 %[0-9]+, 38$' mac.ll; then
            echo "the darwin variant did not take effect"; sed -n '/merged library IR/,/^}/p' mac.ll | head -20; exit 1
          fi
