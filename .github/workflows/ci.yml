name: ci
on: [push, pull_request]

# 最小权限：CI 只读仓库内容（本文件所有作业都只做 checkout / 构建 / 测试 / 跑基准）。
# 显式声明而不是依赖仓库默认值，便于审计与防止默认值被改宽。
permissions:
  contents: read

# 同一 ref 的新推送取消旧运行（省 runner；发布流程另有自己的 concurrency，见 release.yml）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 跨系统门禁：Linux / macOS / Windows 跑同一套 Go 测试（含 qkcheck 误报漏报的多轮 P99 统计）
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（SHA 固定；dependabot 周更）
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5（SHA 固定；dependabot 周更）
        with:
          go-version: '1.26'
      - name: 构建与测试（解释器 + 工具链 + 编辑器产物校验）
        run: |
          go build ./...
          go test ./... -count=1
      - name: 构建与测试（编译器 qkc）
        working-directory: compiler
        run: |
          go build ./...
          go test ./... -count=1
      - name: qkcheck 误报/漏报统计（多轮 P99 门禁）
        env:
          LINT_ROUNDS: '2000'
        run: go test ./internal/lang/ -run 'TestLintStatsP99' -count=1 -v
      - name: 语料扰动不变性（CRLF / 注释 / 行号平移）
        run: go test ./internal/lang/ -run 'TestLintCorpusPerturbation|TestLintCRLF' -count=1 -v

  # Linux 专项：依赖 clang/bash/tree-sitter/node 的部分留在 Linux
  linux-extras:
    name: Linux 专项（双路径 / 编辑器 / 发布）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（SHA 固定；dependabot 周更）
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5（SHA 固定；dependabot 周更）
        with:
          go-version: '1.26'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4（SHA 固定；dependabot 周更）
        with:
          node-version: '20'
      - name: 双路径对比（解释器 vs qkc）
        run: |
          go build -o /tmp/quark main.go
          cd compiler && ./testdata/compare.sh
      - name: 构建工具链二进制（qkcheck/qkdoc/qkrepl/qklsp）
        run: |
          for t in qkcheck qkdoc qkrepl qklsp; do go build -o "/tmp/$t" "./cmd/$t"; done
          /tmp/qkcheck --version && /tmp/qkdoc --version && /tmp/qkrepl --version && /tmp/qklsp --version
      - name: 静态检查自举（qkcheck 扫本仓语料；-exit0 = 报告式，门禁在 Go 快照测试里）
        run: /tmp/qkcheck -exit0 examples compiler/testdata
      - name: 编辑器：tree-sitter 语法（可选，装了 CLI 才跑）
        run: |
          if command -v tree-sitter >/dev/null 2>&1; then
            cd editors/tree-sitter-quarklang
            tree-sitter generate
            tree-sitter test -p .
          else
            echo "未安装 tree-sitter CLI，跳过"
          fi
      - name: 编辑器：VS Code 扩展的 LSP 客户端联调
        run: QKLSP=/tmp/qklsp node editors/vscode/test/protocol.test.js
      - name: 库级基准冒烟（编译 + 跑一次，防基准腐化）
        run: go test ./internal/lang/ ./cmd/qkcheck ./cmd/qkdoc ./cmd/qklsp -run XXX -bench . -benchtime 1x -count=1
      - name: 工具链基准冒烟
        run: ./scripts/bench-tools.sh 3
      - name: 发布产物冒烟（仅本平台，验证脚本可用；用绝对路径输出以覆盖路径归一）
        run: |
          out="${RUNNER_TEMP:-/tmp}/quarklang-dist-ci"
          rm -rf "$out"
          QUARK_TARGETS="linux/amd64" ./scripts/build-release.sh 0.0.0-ci "$out"
          for t in quark qkc qkcheck qkdoc qkrepl qklsp; do
            ls "$out/$t"-0.0.0-ci-linux-amd64 >/dev/null || { echo "缺少产物: $t"; exit 1; }
          done
          ls -la "$out"
      - name: 变更日志生成冒烟
        run: ./scripts/changelog.sh 0.0.0-ci | head -20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4（SHA 固定；dependabot 周更）
        with:
          name: quarklang-ci-linux-amd64
          path: ${{ runner.temp }}/quarklang-dist-ci/*

  # 库制品 / 预处理器：在三平台**真跑**（出库 → 引用 → 运行），验证跨系统不依赖 .so
  libraries:
    name: 库与预处理器（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（SHA 固定；dependabot 周更）
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5（SHA 固定；dependabot 周更）
        with:
          go-version: '1.26'
      - name: 确认 clang 可用（Windows 上把它加进 PATH）
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          fi
          clang --version | head -2
      - name: 构建 qkc
        working-directory: compiler
        run: |
          go build -o qkc .
          if [ -f qkc.exe ]; then echo "QKC=$PWD/qkc.exe" >> "$GITHUB_ENV"; else echo "QKC=$PWD/qkc" >> "$GITHUB_ENV"; fi
      - name: 出库（多平台变体 + 混淆）
        run: |
          mkdir -p /tmp/qklib-ci && cd /tmp/qklib-ci
          cat > ext.qk <<'QK'
          fn scale_cap(int base) int {
          #if os("windows")
              return base + 40;
          #elif os("darwin")
              return base + 38;
          #else
              return base + 37;
          #endif
          }
          fn weight_of(int k, int a) int { return k * 100 + a * 25; }
          QK
          "$QKC" --emit-lib --obfuscate --lib-name libtest --lib-version 0.1.0 \
                 --lib-targets linux-x86_64,windows-x86_64,darwin-arm64,darwin-x86_64 \
                 -o ci.qklib ext.qk
          test -s ci.qklib
      - name: 引用库并运行（断言平台分支正确）
        run: |
          cd /tmp/qklib-ci
          cat > app.qk <<'QK'
          fn main(IOStream io) {
              io.println(libtest.scale_cap(21));
              io.println(libtest.weight_of(3, 2));
          }
          QK
          "$QKC" -c -L ci.qklib -o app app.qk
          OUT=$(./app 2>/dev/null || ./app.exe)
          echo "输出：$OUT"
          # 平台分支：linux 21+37=58 / macOS 21+38=59 / windows 21+40=61
          case "$RUNNER_OS" in
            Linux)   WANT=58 ;;
            macOS)   WANT=59 ;;
            Windows) WANT=61 ;;
          esac
          FIRST=$(echo "$OUT" | head -1)
          [ "$FIRST" = "$WANT" ] || { echo "平台分支断言失败：期望 $WANT 得到 $FIRST"; exit 1; }
          echo "$OUT" | sed -n 2p | grep -q '^350$' || { echo "权重函数断言失败（期望 350）"; exit 1; }
          # 产物不得依赖共享库
          if command -v readelf >/dev/null 2>&1; then
            ! readelf -d app 2>/dev/null | grep -qi 'NEEDED.*libtest' || { echo "不应依赖共享库"; exit 1; }
          fi
      - name: 交叉预处理（--target-os 选择变体）
        run: |
          cd /tmp/qklib-ci
          "$QKC" --emit-ir --target-os windows -L ci.qklib app.qk > win.ll
          "$QKC" --emit-ir --target-os darwin -L ci.qklib app.qk > mac.ll
          # IR 里常量是 add 的第二个操作数（形如 `%2 = add i32 %1, 40`），不要按字面量匹配
          if ! grep -qE 'add i32 %[0-9]+, 40$' win.ll; then
            echo "windows 变体未生效"; sed -n '/merged library IR/,/^}/p' win.ll | head -20; exit 1
          fi
          if ! grep -qE 'add i32 %[0-9]+, 38$' mac.ll; then
            echo "darwin 变体未生效"; sed -n '/merged library IR/,/^}/p' mac.ll | head -20; exit 1
          fi
