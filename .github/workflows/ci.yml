name: ci
on: [push, pull_request]

jobs:
  # 跨系统门禁：Linux / macOS / Windows 跑同一套 Go 测试（含 qkcheck 误报漏报的多轮 P99 统计）
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: 构建与测试（解释器 + 工具链 + 编辑器产物校验）
        run: |
          go build ./...
          go test ./... -count=1
      - name: 构建与测试（编译器 qkc）
        working-directory: compiler
        run: |
          go build ./...
          go test ./... -count=1
      - name: qkcheck 误报/漏报统计（多轮 P99 门禁）
        env:
          LINT_ROUNDS: '2000'
        run: go test ./internal/lang/ -run 'TestLintStatsP99' -count=1 -v
      - name: 语料扰动不变性（CRLF / 注释 / 行号平移）
        run: go test ./internal/lang/ -run 'TestLintCorpusPerturbation|TestLintCRLF' -count=1 -v

  # Linux 专项：依赖 clang/bash/tree-sitter/node 的部分留在 Linux
  linux-extras:
    name: Linux 专项（双路径 / 编辑器 / 发布）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 双路径对比（解释器 vs qkc）
        run: |
          go build -o /tmp/quark main.go
          cd compiler && ./testdata/compare.sh
      - name: 构建工具链二进制（qkcheck/qkdoc/qkrepl/qklsp）
        run: |
          for t in qkcheck qkdoc qkrepl qklsp; do go build -o "/tmp/$t" "./cmd/$t"; done
          /tmp/qkcheck --version && /tmp/qkdoc --version && /tmp/qkrepl --version && /tmp/qklsp --version
      - name: 静态检查自举（qkcheck 扫本仓语料；-exit0 = 报告式，门禁在 Go 快照测试里）
        run: /tmp/qkcheck -exit0 examples compiler/testdata
      - name: 编辑器：tree-sitter 语法（可选，装了 CLI 才跑）
        run: |
          if command -v tree-sitter >/dev/null 2>&1; then
            cd editors/tree-sitter-quarklang
            tree-sitter generate
            tree-sitter test -p .
          else
            echo "未安装 tree-sitter CLI，跳过"
          fi
      - name: 编辑器：VS Code 扩展的 LSP 客户端联调
        run: QKLSP=/tmp/qklsp node editors/vscode/test/protocol.test.js
      - name: 库级基准冒烟（编译 + 跑一次，防基准腐化）
        run: go test ./internal/lang/ ./cmd/qkcheck ./cmd/qkdoc ./cmd/qklsp -run XXX -bench . -benchtime 1x -count=1
      - name: 工具链基准冒烟
        run: ./scripts/bench-tools.sh 3
      - name: 发布产物冒烟（仅本平台，验证脚本可用；用绝对路径输出以覆盖路径归一）
        run: |
          out="${RUNNER_TEMP:-/tmp}/quarklang-dist-ci"
          rm -rf "$out"
          QUARK_TARGETS="linux/amd64" ./scripts/build-release.sh 0.0.0-ci "$out"
          for t in quark qkc qkcheck qkdoc qkrepl qklsp; do
            ls "$out/$t"-0.0.0-ci-linux-amd64 >/dev/null || { echo "缺少产物: $t"; exit 1; }
          done
          ls -la "$out"
      - name: 变更日志生成冒烟
        run: ./scripts/changelog.sh 0.0.0-ci | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: quarklang-ci-linux-amd64
          path: ${{ runner.temp }}/quarklang-dist-ci/*
