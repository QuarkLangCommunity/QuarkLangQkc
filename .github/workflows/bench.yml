name: interpreter benchmarks

# Manual (and nightly) interpreter benchmark run. This exists because micro-optimizations cannot be
# validated on a loaded desktop: a CI runner has no GUI load, so run-to-run dispersion is small
# enough to resolve a few percent. Not a required check — it reports, it does not gate.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'samples per benchmark'
        required: false
        default: '10'
      benchtime:
        description: 'Go benchmark duration per sample (e.g. 1s)'
        required: false
        default: '1s'
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interpreter:
    name: interpreter benchmarks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA-pinned; dependabot updates weekly)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 (SHA-pinned; dependabot updates weekly)
        with:
          go-version: '1.26'
      - name: Run interpreter benchmarks (best of N, bytecode VM on and off)
        run: |
          set -o pipefail
          RUNS='${{ github.event.inputs.runs || '10' }}'
          BT='${{ github.event.inputs.benchtime || '1s' }}'
          # Both engines in one run, so the bytecode VM's contribution is visible without having to
          # compare against a previous run on a possibly different runner.
          for mode in vm treewalk; do
            if [ "$mode" = treewalk ]; then export QUARK_NO_VM=1; else unset QUARK_NO_VM; fi
            echo "### interpreter benchmarks on ${{ matrix.os }} — $mode (runs=$RUNS, benchtime=$BT)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            scripts/bench-interp.sh "$RUNS" "$BT" | tee "/tmp/bench-$mode.txt"
            cat "/tmp/bench-$mode.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Interpreter vs compiler on the shared corpus (parity must hold)
        run: |
          cd compiler
          go build -o /tmp/qkc .
          cd ..
          go build -o /tmp/quark .
          (cd compiler && ./testdata/compare.sh)
