name: 🐞 Bug report
description: Something behaves differently than documented (crash, wrong result, unclear error, tooling issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **A minimal reproduction** is the most valuable part: the smallest program that
        fails, the exact command, and the full output.
        Please do not report security issues here — use Security → Report a vulnerability instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected behavior vs. actual behavior
      placeholder: |
        Expected: prints 42
        Actual: TypeError: …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A runnable .qk snippet (the shorter the better)
      render: qk
    validations:
      required: true
  - type: textarea
    id: cmd
    attributes:
      label: Command and full output
      description: Include the version output (`quark --version` or `qkc --version`)
      render: console
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. quark 2.1.0 (or a short commit hash)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other / not sure]
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Which path
      options: ["Interpreter (quark)", "Compiler (qkc -run or a built binary)", "Both reproduce it", "Not sure"]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else (optional)
      description: Logs, `qkcheck` output, relevant environment variables (`QUARK_CACHE`, `QUARK_CFLAGS`, …)
