name: 💡 Feature request
description: A new feature, syntax improvement, or toolchain enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the scenario and the pain first, then the proposal; avoid stating only a syntax conclusion
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you expect to write / how it should behave
      description: "If possible, write the example in canonical form (type first: `<modifier> <type> <name>`)"
      render: qk
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered (optional)
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Language syntax, Interpreter, Compiler (qkc), Static analysis (qkcheck), Docs (qkdoc), REPL, Editor / LSP, Performance, Other]
    validations:
      required: true
