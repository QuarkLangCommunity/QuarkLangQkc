name: 💡 功能建议
description: 新特性、语法改进、工具链增强
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先讲场景与痛点，再讲方案；避免只给语法结论
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的写法 / 行为
      description: 如果能写成正典形态的示例代码最好（类型在前：`<修饰> <类型> <名字>`）
      render: qk
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案（可选）
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options: [语言语法, 解释器, 编译器 qkc, 静态检查 qkcheck, 文档 qkdoc, REPL, 编辑器/LSP, 性能, 其它]
    validations:
      required: true
